<!DOCTYPE html>

<style>
  /* ========== 默认主题：午夜商务 (midnight) ========== */
  :root {
    --radius: 12px;
    --radius-card: 10px;
    --radius-pill: 6px;

    --btn-bg: #3b82f6;

    --btn-border: #3b82f6;
    --btn-hover-bg: #2563eb;
    --btn-ghost-bg: rgba(59,130,246,.10);
    --btn-ghost-text: #93c5fd;
    --btn-ghost-border: rgba(147,197,253,.45);

    --card-bg: #1e293b;

    --card-hover-border: #60a5fa;
    --card-hover-shadow: 0 8px 22px rgba(59,130,246,.25);

    --modal-text: #e2e8f0;
    --modal-shadow: 0 20px 60px rgba(0,0,0,.6);
    --modal-input-bg: #0f172a;
    --modal-input-border: #334155;

    --empty-text: #64748b;

    --drop-border: #60a5fa;

  /* ========== 主题 4：科技仪表盘 (neon) ========== */
  [data-theme="neon"] {
    --bg: #05080d;
    --bg-image: radial-gradient(1000px 500px at 50% -10%, rgba(34,211,238,.18), transparent 60%),

    --header-label: #67e8f9;

    --input-bg: #0a1420;

    --panel-bg: rgba(10,18,28,0.78);

    --card-border: #134e4a;
    --card-hover-border: #22d3ee;
    --card-hover-shadow: 0 0 18px rgba(34,211,238,.35);
    --card-complex-bg: linear-gradient(180deg, #1a0e0e 0%, #0a0606 100%);

    --tag-bg: #f43f5e;

    --pill-bg: rgba(34,211,238,.10);

    --bar-track: rgba(34,211,238,.10);
    --ok: #34d399;
    --warn: #facc15;
    --over: #ef4444;
    --ok-glow: 0 0 12px rgba(52,211,153,.65), inset 0 0 10px rgba(52,211,153,.35);
    --warn-glow: 0 0 14px rgba(250,204,21,.75), inset 0 0 10px rgba(250,204,21,.35);
    --over-glow: 0 0 22px rgba(239,68,68,.95), 0 0 40px rgba(239,68,68,.55), inset 0 0 12px rgba(239,68,68,.45);
    --bar-label: #ffffff;

    --warning-bg: rgba(239,68,68,.18);

    --modal-overlay: rgba(0,0,0,.75);

    --modal-shadow: 0 0 40px rgba(34,211,238,.25), 0 20px 60px rgba(0,0,0,.7);

  [data-theme="pastel"] {

    --radius-card: 16px;

    --bg: #faf5ff;

    --btn-bg: #a78bfa;
    --btn-text: #ffffff;
    --btn-border: #a78bfa;
    --btn-hover-bg: #8b5cf6;

  /* ========== 主题 6：苹果毛玻璃 (glass) ========== */
  [data-theme="glass"] {
    --radius: 18px;
    --radius-card: 16px;
    --radius-pill: 12px;
    --bg: #eef2ff;
    --bg-image:
      radial-gradient(1200px 700px at 10% 0%, rgba(186,230,253,.85), transparent 60%),
      radial-gradient(1000px 600px at 90% 10%, rgba(221,214,254,.80), transparent 60%),
      radial-gradient(900px 600px at 80% 100%, rgba(252,231,243,.85), transparent 60%),
      radial-gradient(800px 500px at 0% 100%, rgba(207,250,254,.80), transparent 60%),
      linear-gradient(135deg, #eef2ff 0%, #fdf2f8 100%);
    --header-bg: rgba(255,255,255,0.55);
    --header-text: #1d1d1f;
    --header-label: #4b5563;
    --header-border: rgba(255,255,255,0.6);
    --header-shadow: 0 8px 32px rgba(31,38,135,.12), inset 0 1px 0 rgba(255,255,255,.7);

    --input-bg: rgba(255,255,255,0.65);
    --input-text: #1d1d1f;
    --input-border: rgba(255,255,255,0.7);
    --input-focus: #0a84ff;

    --panel-bg: rgba(255,255,255,0.55);
    --panel-border: 1px solid rgba(255,255,255,0.6);
    --panel-shadow: 0 8px 32px rgba(31,38,135,.12), inset 0 1px 0 rgba(255,255,255,.7);
    --panel-divider: rgba(255,255,255,.7);
    --panel-backdrop: blur(20px) saturate(180%);

    --text: #1d1d1f;
    --text-strong: #000000;
    --text-muted: #6b7280;

    --btn-text: #ffffff;
    --btn-border: rgba(255,255,255,0.6);
    --btn-hover-bg: rgba(10,132,255,0.95);
    --btn-ghost-bg: rgba(255,255,255,0.55);
    --btn-ghost-text: #0a84ff;
    --btn-ghost-border: rgba(255,255,255,0.7);

    --card-bg: rgba(255,255,255,0.55);
    --card-border: rgba(255,255,255,0.6);
    --card-hover-border: rgba(10,132,255,.55);
    --card-hover-shadow: 0 12px 32px rgba(10,132,255,.18), inset 0 1px 0 rgba(255,255,255,.7);
    --card-complex-bg: rgba(255,236,205,0.55);
    --card-complex-border: rgba(255,159,10,.6);

    --tag-bg: rgba(255,159,10,0.92);
    --tag-text: #ffffff;

    --pill-bg: rgba(255,255,255,0.55);
    --pill-text: #4b5563;
    --pill-strong: #1d1d1f;

    --bar-track: rgba(255,255,255,0.55);
    --ok: #34c759;
    --warn: #ff9f0a;
    --over: #ff3b30;
    --ok-glow: inset 0 1px 0 rgba(255,255,255,.55);
    --warn-glow: inset 0 1px 0 rgba(255,255,255,.55);
    --over-glow: inset 0 1px 0 rgba(255,255,255,.55), 0 0 16px rgba(255,59,48,.35);
    --bar-label: #1d1d1f;
    --bar-label-shadow: 0 0 6px rgba(255,255,255,.95);

    --warning-bg: rgba(255,59,48,0.18);
    --warning-border: rgba(255,59,48,0.55);
    --warning-text: #b91c1c;

    --drop-bg: rgba(10,132,255,0.10);

  /* glass 主题专属：为非 panel 元素启用毛玻璃模糊（作用域限定，不影响其他主题） */
  [data-theme="glass"] header.top {
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom-color: rgba(255,255,255,0.6);
  }
  [data-theme="glass"] .card {
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    box-shadow: 0 6px 20px rgba(31,38,135,.10), inset 0 1px 0 rgba(255,255,255,.6);
  }
  [data-theme="glass"] .btn {
    backdrop-filter: blur(10px) saturate(160%);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 8px rgba(31,38,135,.10);
  }
  [data-theme="glass"] .btn:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 4px 14px rgba(31,38,135,.14); }
  [data-theme="glass"] .warning {
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 20px rgba(255,59,48,.18);
  }
  [data-theme="glass"] .modal {
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
  }
  [data-theme="glass"] .modal-bg { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  [data-theme="glass"] .team-grid input,
  [data-theme="glass"] .theme-switch select,
  [data-theme="glass"] .modal .field input {
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
  }
  [data-theme="glass"] .bar-track {
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.5);
  }
  [data-theme="glass"] .card-roles div {
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.5);
  }

  /* ========== 通用样式 ========== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { background-color: var(--bg); overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    color: var(--text);
    background-color: var(--bg);
    background-image: var(--bg-image);
    background-attachment: fixed;
    background-size: cover;
    min-height: 100vh;
    line-height: 1.5;
    transition: background-color .3s ease, color .3s ease;
    overflow-x: hidden;
  }
  header.top {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 18px 28px;
    border-bottom: 4px solid var(--header-border);
    box-shadow: var(--header-shadow);
    max-width: 100%;
  }
  .header-top-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 12px; flex-wrap: wrap;
    min-width: 0;
  }
  header.top h1 { margin: 0; font-size: 26px; letter-spacing: 1px; color: var(--header-text); }
  .header-actions {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    min-width: 0; max-width: 100%;
  }
  .header-actions .btn.small.ghost { font-size: 14px; padding: 6px 12px; }
  .theme-switch {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--header-label);
    min-width: 0;
  }
  .theme-switch select {
    font-size: 15px; font-weight: 600;
    padding: 7px 12px; border-radius: var(--radius-pill);
    background: var(--input-bg); color: var(--input-text);
    border: 1.5px solid var(--input-border);
    cursor: pointer; min-width: 140px;
    max-width: 100%;
  }
  .theme-switch select:focus { outline: none; border-color: var(--input-focus); }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(110px, 1fr));
    gap: 14px;
  }
  .team-grid label { display: block; font-size: 14px; color: var(--header-label); margin-bottom: 4px; }
  .team-grid input {
    width: 100%;
    padding: 8px 10px;
    font-size: 20px;
    font-weight: 600;
    border: 2px solid var(--input-border);
    background: var(--input-bg);
    color: var(--input-text);
    border-radius: var(--radius-pill);
    text-align: center;
    transition: border-color .15s ease;
  }
  .team-grid input:focus { outline: none; border-color: var(--input-focus); }
  .holiday-row {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 6px 0 2px;
  }
  .holiday-toggle {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 15px; color: var(--header-text); cursor: pointer;
    user-select: none; white-space: nowrap;
  }
  .holiday-toggle input[type="checkbox"] {
    width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;
  }
  .holiday-custom-wrap {
    display: flex; align-items: center; gap: 10px; flex: 1; min-width: 280px;
  }
  .holiday-custom-wrap label {
    font-size: 13px; color: var(--header-label); white-space: nowrap; margin: 0;
  }
  .holiday-custom-wrap input {
    flex: 1; min-width: 180px;
    padding: 6px 10px; font-size: 14px; font-weight: 500;
    text-align: left;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg); color: var(--input-text);
    border-radius: var(--radius-pill);
  }
  .holiday-custom-wrap input:focus { outline: none; border-color: var(--input-focus); }

  .layout {
    display: grid;
    grid-template-columns: minmax(340px, 1fr) minmax(380px, 1.2fr);
    gap: 20px;
    padding: 20px 28px 40px;
  }
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    .team-grid { grid-template-columns: repeat(2, 1fr); }
    .header-top-row { gap: 10px; }
  }
  @media (max-width: 640px) {
    header.top { padding: 14px 16px; }
    .layout { padding: 16px; }
    .header-actions { width: 100%; justify-content: flex-start; }
    .theme-switch { flex: 1 0 100%; justify-content: flex-end; margin-top: 4px; }
    .theme-switch select { min-width: 0; flex: 1 1 auto; max-width: 220px; }
  }

  .panel {
    background: var(--panel-bg);
    border: var(--panel-border);
    border-radius: var(--radius);
    box-shadow: var(--panel-shadow);
    backdrop-filter: var(--panel-backdrop);
    -webkit-backdrop-filter: var(--panel-backdrop);
    padding: 18px 20px 22px;
    color: var(--text);
    transition: background .2s ease, border-color .2s ease;
    display: flex;
    flex-direction: column;
  }
  .panel.drop-active {
    background: var(--drop-bg);
    border: 2px dashed var(--drop-border);
  }
  .panel h2 {
    margin: 0 0 14px;
    font-size: 22px;
    color: var(--text-strong);
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 2px solid var(--panel-divider);
    padding-bottom: 8px;
  }
  .panel h2 .count {
    font-size: 14px; color: var(--text-muted); font-weight: 500;
  }
  .btn {
    font-size: 15px;
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    font-weight: 600;
    transition: background .15s ease, transform .08s ease;
  }
  .btn:hover { background: var(--btn-hover-bg); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: var(--btn-ghost-bg);
    color: var(--btn-ghost-text);
    border: 1px solid var(--btn-ghost-border);
  }
  .btn.ghost:hover { background: var(--accent-soft); }
  .btn.small { font-size: 13px; padding: 4px 10px; }

  .card-list { display: flex; flex-direction: column; gap: 12px; min-height: 400px; flex: 1; }

  .card {
    border: 2px solid var(--card-border);
    border-radius: var(--radius-card);
    padding: 12px 14px;
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
    transition: transform .08s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card.dragging {
    cursor: grab;
  }
  .card:hover {
    box-shadow: var(--card-hover-shadow);
    border-color: var(--card-hover-border);
  }
  .card.dragging { opacity: .45; }
  .card.complex {
    border-color: var(--card-complex-border);
    background: var(--card-complex-bg);
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 6px;
  }
  .card-title { font-size: 18px; font-weight: 600; color: var(--text-strong); }
  .card-title .tag {
    font-size: 12px;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
    font-weight: 700;
  }
  .card-roles {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    font-size: 14px; color: var(--pill-text);
  }
  .card-roles div {
    background: var(--pill-bg);
    padding: 4px 6px;
    border-radius: 4px;
    text-align: center;
  }
  .card-roles div b { color: var(--pill-strong); font-size: 16px; display: block; }
  .card-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px; font-size: 14px;
  }
  .card-sum { color: var(--accent); font-weight: 700; }
  .card-actions { display: flex; gap: 6px; }

  .capacity-section {
    background: var(--panel-bg);
    border: var(--panel-border);
    border-radius: var(--radius);
    box-shadow: var(--panel-shadow);
    backdrop-filter: var(--panel-backdrop);
    -webkit-backdrop-filter: var(--panel-backdrop);
    padding: 16px 20px;
    margin: 20px 28px 8px;
    color: var(--text);
  }
  .cap-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin-bottom: 12px;
  }
  .cap-header h2 { font-size: 22px; margin: 0; color: var(--text-strong); }
  .warning {
    background: var(--warning-bg);
    color: var(--warning-text);
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 18px;
    border: 2px solid var(--warning-border);
    display: none;
  }
  .warning.show { display: block; animation: pulse 1.2s infinite, shake .55s ease-in-out 1; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 var(--warning-pulse); }
    50% { box-shadow: 0 0 0 10px transparent; }
  }
  /* 爆红 / 抖动：>100% 时强烈提示老板"排不下" */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-3px); }
    20%, 40%, 60%, 80% { transform: translateX(3px); }
  }
  @keyframes redFlash {
    0%, 100% { filter: brightness(1); box-shadow: var(--over-glow, 0 0 0 transparent), 0 0 0 0 rgba(239,68,68,0); }
    50%      { filter: brightness(1.18); box-shadow: var(--over-glow, 0 0 0 transparent), 0 0 16px 4px rgba(239,68,68,.75); }
  }
  @keyframes overPulseBorder {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.55); }
    50%      { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
  }

  .bars { display: flex; flex-direction: column; gap: 12px; }
  .bar-row { display: grid; grid-template-columns: 80px 1fr 150px; align-items: center; gap: 10px; }
  .bar-row .role { font-weight: 700; font-size: 17px; color: var(--text-strong); }
  .bar-track {
    position: relative;
    background: var(--bar-track);
    border-radius: 8px;
    height: 26px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0;
    transition: width .25s ease, background-color .25s ease, box-shadow .25s ease;
    border-radius: 8px 0 0 8px;
  }
  .bar-fill.ok { background: var(--ok); box-shadow: var(--ok-glow); }
  .bar-fill.warn { background: var(--warn); box-shadow: var(--warn-glow); }
  .bar-fill.over {
    background: var(--over);
    box-shadow: var(--over-glow);
    animation: redFlash 1.1s ease-in-out infinite;
  }
  .bar-label {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: var(--bar-label);
    text-shadow: var(--bar-label-shadow);
  }
  .bar-meta { font-size: 14px; color: var(--text-muted); text-align: right; }
  .bar-meta .over-text { color: var(--over); font-weight: 700; }

  .empty-hint {
    color: var(--empty-text); font-style: italic; text-align: center;
    padding: 22px 0; font-size: 15px;
  }

  .modal-bg {
    position: fixed; inset: 0; background: var(--modal-overlay);
    display: none; align-items: center; justify-content: center; z-index: 100;
    backdrop-filter: blur(2px);
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--modal-bg);
    color: var(--modal-text);
    border: var(--panel-border);
    border-radius: var(--radius);
    padding: 22px 24px;
    width: min(440px, 92vw);
    box-shadow: var(--modal-shadow);
  }
  .modal h3 { margin: 0 0 16px; font-size: 20px; color: var(--text-strong); }
  .modal .field { margin-bottom: 12px; }
  .modal .field label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 4px; }
  .modal .field input {
    width: 100%; padding: 8px 10px; font-size: 16px;
    background: var(--modal-input-bg);
    color: var(--modal-text);
    border: 2px solid var(--modal-input-border);
    border-radius: var(--radius-pill);
  }
  .modal .field input:focus { outline: none; border-color: var(--input-focus); }
  .modal .role-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .modal .pri-cpx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .field select {
    width: 100%; padding: 8px 10px; font-size: 16px;
    background: var(--modal-input-bg);
    color: var(--modal-text);
    border: 2px solid var(--modal-input-border);
    border-radius: var(--radius-pill);
    cursor: pointer;
  }
  .modal .field select:focus { outline: none; border-color: var(--input-focus); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

  /* 排序 + 搜索 控件行 */
  .panel-controls {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .panel-controls .search-input {
    flex: 1; min-width: 140px;
    padding: 7px 10px;
    font-size: 15px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg);
    color: var(--input-text);
    border-radius: var(--radius-pill);
  }
  .panel-controls .search-input:focus { outline: none; border-color: var(--input-focus); }
  .panel-controls .sort-select {
    font-size: 14px;
    padding: 7px 10px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg);
    color: var(--input-text);
    border-radius: var(--radius-pill);
    cursor: pointer;
  }
  .panel-controls .sort-select:focus { outline: none; border-color: var(--input-focus); }
  .panel-controls .filter-count {
    font-size: 12px; color: var(--text-muted); white-space: nowrap;
  }

  /* 优先级 / 复杂度 徽章（复用主题语义色，6 套主题自动适配） */
  .card-badges {
    display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap;
  }
  .badge {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 700;
    display: inline-block;
    line-height: 1.4;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .badge.pri-3 {
    background: var(--warning-bg);
    color: var(--warning-text);
    border-color: var(--warning-border);
  }
  .badge.pri-2,
  .badge.cpx-2 {
    background: var(--warn);
    color: #1f2937;
  }
  .badge.pri-1,
  .badge.cpx-1 {
    background: var(--pill-bg);
    color: var(--pill-text);
    border-color: var(--panel-divider);
  }
  .badge.cpx-3 {
    background: var(--tag-bg);
    color: var(--tag-text);
  }
  .badge.sum {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ===== 高级设置行：风险 Buffer + 加人模拟 ===== */
  .advanced-row {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 4px 0;
  }
  .advanced-row .adv-field {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--header-label); white-space: nowrap; margin: 0;
  }
  .advanced-row .adv-field > span:first-child { color: var(--header-text); font-weight: 500; }
  .advanced-row .adv-field input {
    width: 78px; padding: 6px 10px; font-size: 16px; font-weight: 700;
    border: 1.5px solid var(--input-border); background: var(--input-bg);
    color: var(--input-text); border-radius: var(--radius-pill); text-align: center;
  }
  .advanced-row .adv-field input:focus { outline: none; border-color: var(--input-focus); }
  .advanced-row .adv-field .unit { color: var(--header-label); font-size: 13px; }
  .advanced-row .ramp-toggle {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--header-text); cursor: pointer; user-select: none;
  }
  .advanced-row .ramp-toggle input[type="checkbox"] {
    width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;
  }
  .advanced-row .adv-hint {
    color: var(--warn); font-size: 13px; font-weight: 600;
  }

  /* ===== 自动结论 / 缺口总结 + 完成日反推 ===== */
  .cap-conclusion {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    background: var(--accent-soft);
    border: 1.5px solid var(--panel-divider);
    color: var(--text-strong);
    font-size: 17px;
    line-height: 1.55;
  }
  .cap-conclusion .line { display: block; }
  .cap-conclusion .line + .line { margin-top: 6px; }
  .cap-conclusion b { color: var(--text-strong); font-weight: 800; }
  .cap-conclusion .gap-num { font-size: 22px; }
  .cap-conclusion .eta-date { font-size: 22px; font-weight: 800; color: var(--text-strong); }
  .cap-conclusion .note { color: var(--text-muted); font-size: 14px; font-weight: 500; }
  .cap-conclusion.surplus {
    background: rgba(16,185,129,.14);
    border-color: var(--ok);
  }
  .cap-conclusion.surplus b { color: var(--ok); }
  .cap-conclusion.deficit {
    background: var(--warning-bg);
    border-color: var(--warning-border);
    color: var(--warning-text);
  }
  .cap-conclusion.deficit b, .cap-conclusion.deficit .eta-date { color: var(--warning-text); }
  .cap-conclusion.deficit .note { color: var(--warning-text); opacity: .9; }
  .cap-conclusion.empty {
    background: var(--pill-bg);
    border-color: var(--panel-divider);
    color: var(--text-muted);
    font-style: italic;
    font-size: 15px;
  }
  /* 决策化文案：缺口 / 加人 / 砍需求 三选一，老板能直接拍板 */
  .cap-conclusion .decision {
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--warning-bg);
    color: var(--warning-text);
    border: 1.5px dashed var(--warning-border);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.55;
  }
  .cap-conclusion .decision b { color: var(--warning-text); }
  .cap-conclusion .decision .gap-num { font-size: 22px; font-weight: 800; }
  .cap-conclusion .decision .sep { opacity: .55; margin: 0 6px; font-weight: 400; }
  .cap-conclusion.surplus .decision { display: none; }

  /* ===== 迭代6：多期规划 ===== */
  .period-toolbar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .period-count-ctrl, .period-current-ctrl {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--text-muted);
  }
  .period-count-ctrl > span:first-child,
  .period-current-ctrl > label { color: var(--text); font-weight: 500; }
  .period-count-ctrl .btn.small.ghost {
    min-width: 32px; padding: 4px 10px; font-size: 16px; font-weight: 700;
  }
  .period-count-num {
    font-size: 20px; font-weight: 800; color: var(--text-strong);
    min-width: 24px; text-align: center;
  }
  .period-current-ctrl select {
    font-size: 15px; font-weight: 600;
    padding: 6px 10px; border-radius: var(--radius-pill);
    background: var(--input-bg); color: var(--input-text);
    border: 1.5px solid var(--input-border); cursor: pointer; min-width: 110px;
  }
  .period-current-ctrl select:focus { outline: none; border-color: var(--input-focus); }

  .periods-col {
    display: flex; flex-direction: column; gap: 16px;
  }
  /* 排期桶列：列级标题（与需求池 h2 同级风格） */
  .periods-section {
    display: flex; flex-direction: column; gap: 14px;
    min-width: 0;
  }
  .periods-col-title {
    margin: 0;
    font-size: 22px;
    color: var(--text-strong);
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
    border-bottom: 2px solid var(--panel-divider);
    padding: 0 4px 8px;
  }
  .periods-col-subtitle {
    font-size: 14px; color: var(--text-muted); font-weight: 500;
  }
  /* 一键演示：飞行卡片浮层 */
  .demo-flying-card {
    will-change: transform, opacity;
    border-radius: var(--radius-card);
  }
  .period-panel {
    background: var(--panel-bg);
    border: var(--panel-border);
    border-radius: var(--radius);
    box-shadow: var(--panel-shadow);
    backdrop-filter: var(--panel-backdrop);
    -webkit-backdrop-filter: var(--panel-backdrop);
    padding: 14px 18px 18px;
    color: var(--text);
    transition: background .2s ease, border-color .2s ease;
    display: flex; flex-direction: column;
  }
  .period-panel.drop-active {
    background: var(--drop-bg);
    border: 2px dashed var(--drop-border);
  }
  .period-panel.is-current {
    border-left: 4px solid var(--accent);
  }
  .period-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
    border-bottom: 2px solid var(--panel-divider);
    padding-bottom: 8px; margin-bottom: 10px;
  }
  .period-title {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 19px; font-weight: 700; color: var(--text-strong);
  }
  .period-title .period-num { font-size: 22px; }
  .period-title .period-current-flag {
    font-size: 12px; font-weight: 700; padding: 2px 8px;
    border-radius: 4px; background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--accent);
  }
  .period-meta {
    font-size: 13px; color: var(--text-muted); font-weight: 500;
  }
  .period-actions {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .period-warning {
    display: none; align-items: center; gap: 6px;
    background: var(--warning-bg); color: var(--warning-text);
    border: 1.5px solid var(--warning-border);
    padding: 4px 10px; border-radius: 6px;
    font-size: 13px; font-weight: 700;
  }
  .period-warning.show {
    display: inline-flex;
    animation: shake .55s ease-in-out 1, overPulseBorder 1.4s ease-in-out infinite;
  }
  .period-bars {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 8px 16px; margin-bottom: 12px;
  }
  @media (max-width: 720px) {
    .period-bars { grid-template-columns: 1fr; }
  }
  .period-bars .bar-row-mini {
    display: grid; grid-template-columns: 56px 1fr; align-items: center;
    gap: 8px; font-size: 13px;
  }
  .period-bars .bar-row-mini .role {
    font-weight: 700; font-size: 14px; color: var(--text-strong);
  }
  .period-bars .bar-row-mini .bar-track { height: 20px; }
  .period-bars .bar-row-mini .bar-label { font-size: 12px; }
  .period-card-list {
    display: flex; flex-direction: column; gap: 10px;
    min-height: 120px; flex: 1;
  }
  .period-card-list .card { padding: 10px 12px; }

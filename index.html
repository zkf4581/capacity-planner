    // 2026
    "2026-01-01","2026-01-02","2026-01-03",
    "2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20","2026-02-21","2026-02-22",
    "2026-04-04","2026-04-05","2026-04-06",
    "2026-05-01","2026-05-02","2026-05-03","2026-05-04","2026-05-05",
    "2026-06-19","2026-06-20","2026-06-21",
    "2026-09-25","2026-09-26","2026-09-27",
    "2026-10-01","2026-10-02","2026-10-03","2026-10-04","2026-10-05","2026-10-06","2026-10-07"
  ];

  function parseCustomHolidays(s) {
    if (!s) return [];
    return String(s).split(/[\s,，、;；]+/)
      .map(x => x.trim())
      .filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x));
  }

  let nextId = 1;
  // priority / complexity: 3=高 2=中 1=低；complexity===3 沿用 .card.complex 高亮
  // deps: 前置需求 id 数组（A 未完不能做 B）
  function mk(name, pm, fe, be, qa, priority, complexity, deps) {
    return {
      id: "c" + (nextId++),
      name, pm, fe, be, qa,
      priority: (priority === 1 || priority === 2 || priority === 3) ? priority : 2,
      complexity: (complexity === 1 || complexity === 2 || complexity === 3) ? complexity : 2,
      deps: Array.isArray(deps) ? deps.slice() : [],
      zone: "pool"
    };
  }

  const cards = [
    mk("签合同模块（模板/电子签/审批/归档）", 5, 8, 10, 5, 3, 3),
    mk("考勤打卡",        1, 2, 3, 2, 2, 1),
    mk("项目进度上报",    2, 3, 4, 2, 3, 2, ["c2"]),
    mk("材料申领审批",    2, 2, 3, 2, 2, 2),
    mk("工地巡检拍照",    1, 3, 2, 2, 1, 1),
    mk("工资条查看",      1, 1, 2, 1, 1, 1),
    mk("安全隐患上报",    2, 2, 3, 2, 3, 2, ["c5"]),
    mk("消息通知",        1, 2, 2, 1, 2, 1)
  ];

  // ===== 多期规划：全局状态 =====
  const MIN_PERIODS = 2;
  const MAX_PERIODS = 6;
  const DEFAULT_PERIODS = 3;
  let periodsCount = DEFAULT_PERIODS;
  let currentPeriod = 1;

  // 排序使用「池」上的全局规则；池单独有搜索框。
  const viewState = {
    pool: { sort: "pri", q: "" }
  };
  const LEVEL_LABEL = { 3: "高", 2: "中", 1: "低" };

  const $ = (id) => document.getElementById(id);
  const poolList = $("poolList");
  const poolPanel = $("poolPanel");
  const periodsContainer = $("periodsContainer");
  const poolCountEl = $("poolCount");
  const workdaysDisplay = $("workdaysDisplay");
  const poolSearchEl = $("poolSearch");
  const poolSortEl = $("poolSort");
  const poolFilterCountEl = $("poolFilterCount");
  const periodCountDisplay = $("periodCountDisplay");
  const periodMinusBtn = $("periodMinus");
  const periodPlusBtn = $("periodPlus");
  const currentPeriodSel = $("currentPeriodSel");

  function initDates() {
    const today = new Date();
    const end = new Date(today);
    end.setDate(end.getDate() + 14);
    $("r_start").value = today.toISOString().split('T')[0];
    $("r_end").value = end.toISOString().split('T')[0];
  }

  // 返回 { days, deducted }：deducted 仅计落在区间内且非周末却被节假日/自定义假日扣除的天数。
  function calcWorkdays(start, end, holidaySet) {
    if (!start || !end) return { days: 0, deducted: 0 };
    const d1 = new Date(start);
    const d2 = new Date(end);
    if (d2 < d1) return { days: 0, deducted: 0 };
    const has = holidaySet && typeof holidaySet.has === "function";
    let days = 0;
    let deducted = 0;
    const current = new Date(d1);
    const pad = (n) => (n < 10 ? "0" + n : "" + n);
    while (current <= d2) {
      const day = current.getDay();
      if (day !== 0 && day !== 6) {
        const key = current.getFullYear() + "-" + pad(current.getMonth() + 1) + "-" + pad(current.getDate());
        if (has && holidaySet.has(key)) {
          deducted++;
        } else {
          days++;
        }
      }
      current.setDate(current.getDate() + 1);
    }
    return { days, deducted };
  }

  function readTeam() {
    const n = (id, d) => {
      const v = parseFloat($(id).value);
      return isNaN(v) || v < 0 ? d : v;
    };
    const start = $("r_start").value;
    const end = $("r_end").value;
    const holidayOn = $("r_holidayOn").checked;
    const customRaw = $("r_customHolidays").value;
    const customList = parseCustomHolidays(customRaw);
    const set = new Set();
    if (holidayOn) CN_HOLIDAYS.forEach(d => set.add(d));
    customList.forEach(d => set.add(d));
    const { days, deducted } = calcWorkdays(start, end, set);
    return {
      pm: n("r_pm", 0),
      be: n("r_be", 0),
      fe: n("r_fe", 0),
      fs: n("r_fs", 0),
      qa: n("r_qa", 0),
      days: Math.max(0, days),
      deducted: deducted,
      hours: Math.max(1, n("r_hours", 1)),
      start: start,
      end: end,
      holidayOn: holidayOn,
      customHolidays: customRaw
    };
  }

  function capacity(team, factor) {
    const f = (factor == null) ? 1 : factor;
    return {
      pm: team.pm * team.days * f,
      fe: (team.fe + team.fs * 0.5) * team.days * f,
      be: (team.be + team.fs * 0.5) * team.days * f,
      qa: team.qa * team.days * f
    };
  }

  // 新人爬坡折损常量：新人在本期内仅发挥 60% 产能
  const RAMP_FACTOR = 0.6;

  function readSettings() {
    const num = (id, d, min, max) => {
      let v = parseFloat($(id).value);
      if (isNaN(v)) v = d;
      if (min != null) v = Math.max(min, v);
      if (max != null) v = Math.min(max, v);
      return v;
    };
    return {
      buffer:    num("r_buffer", 20, 0, 100),
      rampOn:    $("r_rampOn").checked,
      newcomers: Math.max(0, Math.floor(num("r_newcomers", 0, 0, 999)))
    };
  }

  // 把"全队按新人比例打折"换算成一个统一的 0~1 系数
  function rampFactor(team, settings) {
    if (!settings.rampOn) return 1;
    const total = team.pm + team.fe + team.be + team.fs + team.qa;
    if (total <= 0) return 1;
    const n = Math.min(settings.newcomers, total);
    if (n <= 0) return 1;
    return (total - n + n * RAMP_FACTOR) / total;
  }

  // 从 startStr 起向后推 count 个工作日（跳过周末 + holidaySet），返回 YYYY-MM-DD
  function addWorkdays(startStr, count, holidaySet) {
    if (!startStr || count <= 0) return null;
    const pad = (n) => (n < 10 ? "0" + n : "" + n);
    const has = holidaySet && typeof holidaySet.has === "function";
    const d = new Date(startStr);
    if (isNaN(d.getTime())) return null;
    let remaining = count;
    let lastDate = null;
    let safety = 0;
    while (remaining > 0 && safety < 365 * 20) {
      const day = d.getDay();
      if (day !== 0 && day !== 6) {
        const key = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        if (!(has && holidaySet.has(key))) {
          remaining--;
          lastDate = new Date(d);
          if (remaining === 0) break;
        }
      }
      d.setDate(d.getDate() + 1);
      safety++;
    }
    if (!lastDate) return null;
    return lastDate.getFullYear() + "-" + pad(lastDate.getMonth() + 1) + "-" + pad(lastDate.getDate());
  }

  function periodZone(i) { return "p" + i; }
  function periodIndex(zone) {
    const m = /^p(\d+)$/.exec(zone || "");
    return m ? parseInt(m[1], 10) : 0;
  }
  function isPeriodZone(zone) { return periodIndex(zone) > 0; }

  function usedInZone(zone) {
    const u = { pm:0, fe:0, be:0, qa:0 };
    cards.forEach(c => {
      if (c.zone === zone) { u.pm += c.pm; u.fe += c.fe; u.be += c.be; u.qa += c.qa; }
    });
    return u;
  }

  // 从 startStr 的下一天起，找下一个非周末/非节假日的工作日，返回 YYYY-MM-DD
  function nextWorkday(startStr, holidaySet) {
    if (!startStr) return null;
    const pad = (n) => (n < 10 ? "0" + n : "" + n);
    const has = holidaySet && typeof holidaySet.has === "function";
    const d = new Date(startStr);
    if (isNaN(d.getTime())) return null;
    d.setDate(d.getDate() + 1);
    let safety = 0;
    while (safety < 365 * 5) {
      const day = d.getDay();
      if (day !== 0 && day !== 6) {
        const key = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        if (!(has && holidaySet.has(key))) return key;
      }
      d.setDate(d.getDate() + 1);
      safety++;
    }
    return null;
  }

  // 计算各期的 {index, start, end, days, deducted}。第1期取顶部起止日期；
  // 第K期(K>=2) 从上一期结束日之后的第一个工作日开始，工作日数=第1期工作日数。
  function computePeriodInfos(team, holidaySet) {
    const infos = [];
    const dayCount = team.days;
    let cursorEnd = team.end || null;
    for (let i = 1; i <= periodsCount; i++) {
      if (!team.start || !team.end || dayCount <= 0) {
        infos.push({ index: i, start: null, end: null, days: 0, deducted: 0 });
        continue;
      }
      let start, end;
      if (i === 1) {
        start = team.start;
        end = team.end;
      } else {
        start = nextWorkday(cursorEnd, holidaySet);
        if (!start) { infos.push({ index: i, start: null, end: null, days: 0, deducted: 0 }); continue; }
        end = addWorkdays(start, dayCount, holidaySet);
        if (!end) { infos.push({ index: i, start: start, end: null, days: 0, deducted: 0 }); continue; }
      }
      const wd = calcWorkdays(start, end, holidaySet);
      infos.push({ index: i, start, end, days: wd.days, deducted: wd.deducted });
      cursorEnd = end;
    }
    return infos;
  }

  function fmt(n) {
    return Number.isInteger(n) ? String(n) : (Math.round(n * 10) / 10).toString();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  function cardSum(c) { return c.pm + c.fe + c.be + c.qa; }

  // ===== 迭代7：依赖辅助 =====
  function cardById(id) { return cards.find(c => c.id === id) || null; }

  // 卡片 c 当前是否存在「依赖冲突」：
  // 仅对已分配到期的卡判定。冲突条件：任一前置仍在需求池，或前置所在期 >= 本卡所在期。
  // 返回冲突的前置卡数组（可能为空）。
  function depConflicts(c) {
    if (!c || !Array.isArray(c.deps) || c.deps.length === 0) return [];
    const myIdx = periodIndex(c.zone);
    if (myIdx <= 0) return []; // 池中的卡不算冲突
    const bad = [];
    c.deps.forEach(depId => {
      const d = cardById(depId);
      if (!d) return; // 已被删除的依赖，忽略
      const dIdx = periodIndex(d.zone);
      if (dIdx <= 0 || dIdx >= myIdx) bad.push(d);
    });
    return bad;
  }

  function depNamesForLabel(c) {
    if (!c || !Array.isArray(c.deps) || c.deps.length === 0) return [];
    return c.deps.map(id => cardById(id)).filter(Boolean).map(d => d.name);
  }

  // inPeriodIdx: 0 表示在需求池；>=1 表示在第 K 期
  function cardHtml(c, inPeriodIdx) {
    const sum = cardSum(c);
    const isComplex = c.complexity === 3;
    const priLbl = LEVEL_LABEL[c.priority] || "中";
    const cpxLbl = LEVEL_LABEL[c.complexity] || "中";
    const inPeriod = inPeriodIdx > 0;
    const actLabel = inPeriod ? "⬅ 移回需求池" : `加入第${currentPeriod}期 ➡`;
    const actName = inPeriod ? "back" : "add";

    const depNames = depNamesForLabel(c);
    const depInfoHtml = depNames.length === 0 ? "" :
      `<div class="dep-info"><span class="dep-label">🧱 依赖：</span>` +
      depNames.map(n => `<span class="dep-tag">${escapeHtml(n)}</span>`).join("") +
      `</div>`;

    const conflicts = depConflicts(c);
    const hasConflict = conflicts.length > 0;
    const conflictNames = conflicts.map(d => d.name).join("、");
    const conflictTitle = hasConflict
      ? ` title="需先完成：${escapeHtml(conflictNames)}（前置须排在更早的期）"` : "";
    const conflictMsgHtml = hasConflict
      ? `<div class="dep-conflict-msg">⚠ 依赖冲突：需先完成「${escapeHtml(conflictNames)}」，请把前置排到更早的期</div>`
      : "";

    return `
      <div class="card ${isComplex ? "complex" : ""}${hasConflict ? " dep-conflict" : ""}" draggable="true" data-id="${c.id}"${conflictTitle}>
        <div class="card-head">
          <div class="card-title">${hasConflict ? "⚠ " : ""}${escapeHtml(c.name)}</div>
          <div class="card-actions">
            <button class="btn small ghost" data-act="edit" data-id="${c.id}">编辑</button>
            <button class="btn small ghost" data-act="del" data-id="${c.id}">删除</button>
          </div>
        </div>
        <div class="card-badges">
          <span class="badge pri-${c.priority}">优先级·${priLbl}</span>
          <span class="badge cpx-${c.complexity}">复杂度·${cpxLbl}</span>
          <span class="badge sum">合计 ${fmt(sum)} 人天</span>
        </div>
        <div class="card-roles">
          <div>产品<b>${fmt(c.pm)}</b></div>
          <div>前端<b>${fmt(c.fe)}</b></div>
          <div>后端<b>${fmt(c.be)}</b></div>
          <div>测试<b>${fmt(c.qa)}</b></div>
        </div>
        ${depInfoHtml}
        ${conflictMsgHtml}
        <div class="card-foot">
          <div class="card-sum">合计 ${fmt(sum)} 人天</div>
          <button class="btn small" data-act="${actName}" data-id="${c.id}">${actLabel}</button>
        </div>
      </div>`;
  }

  function sortCards(arr, mode) {
    const a = arr.slice();
    switch (mode) {
      case "cpx":      a.sort((x, y) => (y.complexity - x.complexity) || x.name.localeCompare(y.name, "zh")); break;
      case "sumDesc":  a.sort((x, y) => (cardSum(y) - cardSum(x)) || x.name.localeCompare(y.name, "zh")); break;
      case "sumAsc":   a.sort((x, y) => (cardSum(x) - cardSum(y)) || x.name.localeCompare(y.name, "zh")); break;
      case "name":     a.sort((x, y) => x.name.localeCompare(y.name, "zh")); break;
      case "pri":
      default:         a.sort((x, y) => (y.priority - x.priority) || x.name.localeCompare(y.name, "zh")); break;
    }
    return a;
  }

  function filterCards(arr, q) {
    if (!q) return arr;
    const needle = q.toLowerCase();
    return arr.filter(c => c.name.toLowerCase().includes(needle));
  }

  function renderPool() {
    const all = cards.filter(c => c.zone === "pool");
    const filtered = filterCards(all, viewState.pool.q);
    const shown = sortCards(filtered, viewState.pool.sort);
    if (all.length === 0) {
      poolList.innerHTML = '<div class="empty-hint">需求池空了，点右上角"+ 新增需求"添加。</div>';
    } else if (shown.length === 0) {
      poolList.innerHTML = '<div class="empty-hint">没有匹配的需求，清空搜索框可恢复显示。</div>';
    } else {
      poolList.innerHTML = shown.map(c => cardHtml(c, 0)).join("");
    }
    poolCountEl.textContent = `共 ${all.length} 个`;
    poolFilterCountEl.textContent = viewState.pool.q
      ? `显示 ${shown.length} / 共 ${all.length}` : "";
  }

  // 渲染多期面板。返回 { overflowPeriods, overflowPD }：
  //   overflowPeriods: 爆红期号数组；overflowPD: 各期已超额人天合计（用于决策化结论）。
  function renderPeriods(team, settings, factor, periodInfos) {
    const overflowPeriods = [];
    let overflowPD = 0;
    let html = "";
    for (let i = 1; i <= periodsCount; i++) {
      const info = periodInfos[i - 1];
      const periodTeam = Object.assign({}, team, { days: info.days });
      const cap = capacity(periodTeam, factor);
      const zone = periodZone(i);
      const used = usedInZone(zone);
      let anyOver = false;
      const barHtml = ROLES.map(r => {
        const c = cap[r.key];
        const u = used[r.key];
        const pct = c > 0 ? (u / c * 100) : (u > 0 ? 999 : 0);
        const pctR = Math.round(pct);
        let cls = "ok";
        if (pctR > 100) { cls = "over"; anyOver = true; }
        else if (pctR > 80) cls = "warn";
        const width = Math.min(pct, 100);
        if (u > c) overflowPD += (u - c);
        return `
          <div class="bar-row-mini">
            <div class="role">${r.name}</div>
            <div class="bar-track">
              <div class="bar-fill ${cls}" style="width:${width}%"></div>
              <div class="bar-label">${fmt(u)} / ${fmt(c)}　${pctR}%</div>
            </div>
          </div>`;
      }).join("");
      if (anyOver) overflowPeriods.push(i);

      const periodCards = sortCards(cards.filter(c => c.zone === zone), viewState.pool.sort);
      const periodSum = periodCards.reduce((s, c) => s + cardSum(c), 0);
      const cardsHtml = periodCards.length === 0
        ? '<div class="period-empty">拖拽需求到此处，或在需求池单击需求卡（默认进当前期）。</div>'
        : periodCards.map(c => cardHtml(c, i)).join("");

      let dateLabel;
      if (info.start && info.end && info.days > 0) {
        const ded = info.deducted > 0 ? `（扣 ${info.deducted} 节假日）` : "";
        dateLabel = `${info.start} → ${info.end} · ${info.days} 个工作日${ded}`;
      } else if (!team.start || !team.end) {
        dateLabel = "请先在顶部设置起止日期";
      } else if (info.start && !info.end) {
        dateLabel = `${info.start} 起，无法计算结束日`;
      } else {
        dateLabel = "无可用工作日";
      }

      const isCurrent = (i === currentPeriod);
      const setCurrentBtn = isCurrent
        ? ''
        : `<button type="button" class="btn small ghost" data-act="setCurrent" data-period="${i}">设为当前期</button>`;
      html += `
        <section class="period-panel ${isCurrent ? "is-current" : ""}" data-zone="${zone}">
          <div class="period-head">
            <div class="period-title">
              <span class="period-num">🚀 第${i}期</span>
              ${isCurrent ? '<span class="period-current-flag">当前</span>' : ''}
              <span class="period-meta">${dateLabel}</span>
            </div>
            <div class="period-actions">
              <span class="period-warning ${anyOver ? "show" : ""}">⚠️ 本期排不下</span>
              <span class="period-meta">${periodCards.length} 个 · 合计 ${fmt(periodSum)} 人天</span>
              ${setCurrentBtn}
              <button type="button" class="btn small ghost" data-act="backPeriod" data-period="${i}">⬅ 全部移回</button>
            </div>
          </div>
          <div class="period-bars">${barHtml}</div>
          <div class="period-card-list" data-zone="${zone}">${cardsHtml}</div>
        </section>`;
    }
    periodsContainer.innerHTML = html;
    return { overflowPeriods, overflowPD };
  }

  // 顶部全局总结：分配进度 + 全部做完到哪天 + 哪些期排不下 + 决策化文案
  function renderConclusion(team, settings, factor, periodInfos, overflowPeriods, overflowPD) {
    const el = $("conclusion");
    if (!el) return;

    const totalCards = cards.length;
    const inPool = cards.filter(c => c.zone === "pool").length;
    const allocated = totalCards - inPool;

    let neededPeriods = 0;
    for (let i = 1; i <= periodsCount; i++) {
      if (cards.some(c => c.zone === periodZone(i))) neededPeriods = i;
    }
    const lastInfo = neededPeriods > 0 ? periodInfos[neededPeriods - 1] : null;

    const bufferPct = settings.buffer;
    const rampLabel = (settings.rampOn && settings.newcomers > 0)
      ? `（含 ${settings.newcomers} 位新人按 ${Math.round(RAMP_FACTOR * 100)}% 产能折损）` : "";
    const bufferLabel = bufferPct > 0 ? `（含 ${bufferPct}% 风险预留）` : "";

    if (totalCards === 0) {
      el.className = "cap-conclusion empty";
      el.innerHTML = '💡 当前没有需求；点上方"+ 新增需求"开始排兵布阵。';
      return;
    }
    if (allocated === 0) {
      el.className = "cap-conclusion empty";
      el.innerHTML = `💡 还没有需求被分配到任何期：把需求拖入"第1~${periodsCount}期"或单击需求卡进入当前期，将自动展示分配进度与完成日。`;
      return;
    }

    const allocChip = (inPool === 0)
      ? `<span class="summary-chip ok">已分配 <b>${allocated}</b> / 共 <b>${totalCards}</b> 个 ✅</span>`
      : `<span class="summary-chip">已分配 <b>${allocated}</b> / 共 <b>${totalCards}</b> 个，未分配 <b>${inPool}</b> 还在需求池</span>`;

    let etaChip;
    if (!lastInfo || !lastInfo.end) {
      etaChip = `<span class="summary-chip">⏳ 请先设置顶部起止日期</span>`;
    } else {
      const hasUnassigned = inPool > 0;
      const hasOver = overflowPeriods && overflowPeriods.length > 0;
      const cls = (hasUnassigned || hasOver) ? "summary-chip warn" : "summary-chip ok";
      const tail = hasUnassigned ? "（仍有未分配需求，实际还会更晚）" : "";
      etaChip = `<span class="${cls}">全部做完需 <b>${neededPeriods}</b> 期，最晚到 <b class="eta-date">${lastInfo.end}</b>${tail}</span>`;
    }

    let overflowChip = "";
    if (overflowPeriods && overflowPeriods.length > 0) {
      overflowChip = `<span class="summary-chip warn overflow-warn">⚠️ 第 ${overflowPeriods.join("、")} 期排不下，建议把需求往后挪</span>`;
    }

    // 依赖冲突总数（仅统计已分配到期的卡）
    let depConflictCount = 0;
    cards.forEach(c => { if (depConflicts(c).length > 0) depConflictCount++; });
    const hasDepConflict = depConflictCount > 0;
    const totalDepCards = cards.filter(c => Array.isArray(c.deps) && c.deps.length > 0).length;
    let depChip = "";
    if (hasDepConflict) {
      depChip = `<span class="summary-chip dep-warn">⚠ 存在 <b>${depConflictCount}</b> 处依赖冲突（地基没干完不能砌墙）</span>`;
    } else if (totalDepCards > 0) {
      depChip = `<span class="summary-chip ok">🧱 依赖检查通过 ✓</span>`;
    }

    const rangeBits = periodInfos.map(info => {
      if (!info.start || !info.end) return `第${info.index}期：—`;
      return `第${info.index}期 ${info.start}→${info.end}（${info.days}天）`;
    }).join(" ｜ ");

    // ===== 决策化文案：缺口 Z 人天 → X 周 / 加 Y 人 / 砍需求 =====
    // 缺口 = 已分配但超容量(overflowPD) + 仍在池中未分配卡的人天合计
    const poolPD = cards.filter(c => c.zone === "pool").reduce((s, c) => s + cardSum(c), 0);
    const totalGapPD = (overflowPD || 0) + poolPD;
    let decisionLine = "";
    if (totalGapPD > 0.001) {
      const gapDisp = fmt(Math.round(totalGapPD * 10) / 10);
      // X 周：按 1 人 1 周 5 工作日推算（保留中文措辞）
      const extraWeeks = Math.max(1, Math.ceil(totalGapPD / 5));
      // Y 人：按一期工作日数推算需多少人在一期内消化缺口；team.days 为 0 时降级到周
      const dayBase = team.days > 0 ? team.days : 5;
      const extraPeople = Math.max(1, Math.ceil(totalGapPD / dayBase));
      const reason = (overflowPD > 0.001 && poolPD > 0.001)
        ? "（含已超额 + 池中未分配）"
        : (overflowPD > 0.001 ? "（已超出当期容量）" : "（仍在需求池未分配）");
      decisionLine =
        `<span class="line decision">💡 要补上 ≈ <span class="gap-num">${gapDisp}</span> 人天 ${reason}` +
        `<br>👉 大约再 <b>${extraWeeks}</b> 周加班 <span class="sep">·</span> 或加 <b>${extraPeople}</b> 人 <span class="sep">·</span> 或 <b>砍掉部分需求</b></span>`;
    }

    const overall = (inPool === 0 && (!overflowPeriods || overflowPeriods.length === 0) && !hasDepConflict);
    const deficit = (overflowPeriods && overflowPeriods.length > 0) || hasDepConflict;
    el.className = "cap-conclusion" + (overall ? " surplus" : (deficit ? " deficit" : ""));
    el.innerHTML =
      `<span class="line">📊 共 <b>${periodsCount}</b> 期排期${bufferLabel}${rampLabel}</span>` +
      `<span class="line"><span class="summary-stats">${allocChip}${etaChip}${overflowChip}${depChip}</span></span>` +
      decisionLine +
      `<span class="line note" style="font-size:13px;">${rangeBits}</span>`;
  }

  function refreshCurrentPeriodSelect() {
    let opts = "";
    for (let i = 1; i <= periodsCount; i++) {
      opts += `<option value="${i}"${i === currentPeriod ? " selected" : ""}>第${i}期</option>`;
    }
    currentPeriodSel.innerHTML = opts;
  }

  function renderAll() {
    const team = readTeam();
    const settings = readSettings();
    const factor = rampFactor(team, settings);

    // 新人折损提示
    const rampHintEl = $("rampHint");
    if (rampHintEl) {
      rampHintEl.style.display = (settings.rampOn && settings.newcomers > 0) ? "" : "none";
    }

    // 顶部第1期工作日提示
    if (team.days === 0 && team.start && team.end) {
      const endDate = new Date(team.end);
      const startDate = new Date(team.start);
      if (endDate < startDate) {
        workdaysDisplay.textContent = "⚠️ 结束日期不能早于开始日期";
        workdaysDisplay.style.color = "var(--over)";
      } else {
        workdaysDisplay.textContent = `📅 第1期共 0 个工作日（区间内全部为周末或节假日${team.deducted ? "，已扣除 " + team.deducted + " 天节假日" : ""}）`;
        workdaysDisplay.style.color = "var(--text-strong)";
      }
    } else if (team.days === 0) {
      workdaysDisplay.textContent = "请设置开始和结束日期";
      workdaysDisplay.style.color = "var(--text-muted)";
    } else {
      const extra = team.deducted > 0 ? `，已扣除 ${team.deducted} 天节假日` : "";
      workdaysDisplay.textContent = `📅 第1期共 ${team.days} 个工作日（已排除周末${extra}）；后续各期自动按相同工作日数顺排。`;
      workdaysDisplay.style.color = "var(--text-strong)";
    }

    const holidaySet = new Set();
    if (team.holidayOn) CN_HOLIDAYS.forEach(d => holidaySet.add(d));
    parseCustomHolidays(team.customHolidays).forEach(d => holidaySet.add(d));
    const periodInfos = computePeriodInfos(team, holidaySet);

    renderPool();
    const { overflowPeriods, overflowPD } = renderPeriods(team, settings, factor, periodInfos);
    renderConclusion(team, settings, factor, periodInfos, overflowPeriods, overflowPD);

    periodCountDisplay.textContent = String(periodsCount);
    refreshCurrentPeriodSelect();
  }

  // ===== 持久化 / 导入 / 导出 =====
  // 默认 deps 用「名称」描述，loadDefaultCards 时按生成的 id 二次回填，避免与 nextId 耦合。
  const DEFAULT_CARDS_SNAPSHOT = [
    { name: "签合同模块（模板/电子签/审批/归档）", pm: 5, fe: 8, be: 10, qa: 5, priority: 3, complexity: 3, depsByName: [] },
    { name: "考勤打卡",        pm: 1, fe: 2, be: 3, qa: 2, priority: 2, complexity: 1, depsByName: [] },
    { name: "项目进度上报",    pm: 2, fe: 3, be: 4, qa: 2, priority: 3, complexity: 2, depsByName: ["考勤打卡"] },
    { name: "材料申领审批",    pm: 2, fe: 2, be: 3, qa: 2, priority: 2, complexity: 2, depsByName: [] },
    { name: "工地巡检拍照",    pm: 1, fe: 3, be: 2, qa: 2, priority: 1, complexity: 1, depsByName: [] },
    { name: "工资条查看",      pm: 1, fe: 1, be: 2, qa: 1, priority: 1, complexity: 1, depsByName: [] },
    { name: "安全隐患上报",    pm: 2, fe: 2, be: 3, qa: 2, priority: 3, complexity: 2, depsByName: ["工地巡检拍照"] },
    { name: "消息通知",        pm: 1, fe: 2, be: 2, qa: 1, priority: 2, complexity: 1, depsByName: [] }
  ];

  function serialize() {
    return {
      version: DATA_VERSION,
      team: {
        pm: $("r_pm").value, be: $("r_be").value, fe: $("r_fe").value,
        fs: $("r_fs").value, qa: $("r_qa").value,
        start: $("r_start").value, end: $("r_end").value,
        hours: $("r_hours").value,
        holidayOn: $("r_holidayOn").checked,
        customHolidays: $("r_customHolidays").value,
        buffer: $("r_buffer").value,
        rampOn: $("r_rampOn").checked,
        newcomers: $("r_newcomers").value
      },
      periodsCount: periodsCount,
      currentPeriod: currentPeriod,
      cards: cards.map(c => ({
        id: c.id, name: c.name, pm: c.pm, fe: c.fe, be: c.be, qa: c.qa,
        priority: c.priority, complexity: c.complexity,
        deps: Array.isArray(c.deps) ? c.deps.slice() : [],
        zone: c.zone
      })),
      nextId: nextId,
      viewState: {
        pool: { sort: viewState.pool.sort, q: viewState.pool.q }
      }
    };
  }

  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(serialize())); } catch (_) {}
  }

  function setTeamInputs(t) {
    if (!t) return;
    if (t.pm    != null) $("r_pm").value    = t.pm;
    if (t.be    != null) $("r_be").value    = t.be;
    if (t.fe    != null) $("r_fe").value    = t.fe;
    if (t.fs    != null) $("r_fs").value    = t.fs;
    if (t.qa    != null) $("r_qa").value    = t.qa;
    if (t.start != null) $("r_start").value = t.start;
    if (t.end   != null) $("r_end").value   = t.end;
    if (t.hours != null) $("r_hours").value = t.hours;
    if (typeof t.holidayOn === "boolean") $("r_holidayOn").checked = t.holidayOn;
    if (typeof t.customHolidays === "string") $("r_customHolidays").value = t.customHolidays;
    if (t.buffer != null) $("r_buffer").value = t.buffer;
    if (typeof t.rampOn === "boolean") $("r_rampOn").checked = t.rampOn;
    if (t.newcomers != null) $("r_newcomers").value = t.newcomers;
  }

  function applyData(obj) {
    if (!obj || typeof obj !== "object") throw new Error("数据格式不正确");
    if (!Array.isArray(obj.cards)) throw new Error("数据缺少 cards 数组");
    setTeamInputs(obj.team);

    // 期数 / 当前期
    const pc = parseInt(obj.periodsCount, 10);
    periodsCount = (isFinite(pc) && pc >= MIN_PERIODS && pc <= MAX_PERIODS) ? pc : DEFAULT_PERIODS;
    const cp = parseInt(obj.currentPeriod, 10);
    currentPeriod = (isFinite(cp) && cp >= 1 && cp <= periodsCount) ? cp : 1;

    cards.length = 0;
    let maxId = 0;
    obj.cards.forEach(raw => {
      if (!raw || typeof raw !== "object") return;
      const n = (v) => {
        const x = parseFloat(v);
        return isNaN(x) || x < 0 ? 0 : x;
      };
      const lvl = (v) => (v === 1 || v === 2 || v === 3) ? v : 2;
      const id = (typeof raw.id === "string" && raw.id) ? raw.id : "c" + (++maxId);
      const m = /^c(\d+)$/.exec(id);
      if (m) { const num = parseInt(m[1], 10); if (num > maxId) maxId = num; }
      // zone 归一化：老存档的 "sprint" → "p1"；"pN" 超过当前期数 → "pN'"=periodsCount；其他/未知 → "pool"
      let zone = "pool";
      if (raw.zone === "sprint") zone = "p1";
      else if (typeof raw.zone === "string") {
        const pm = /^p(\d+)$/.exec(raw.zone);
        if (pm) {
          let k = parseInt(pm[1], 10);
          if (k < 1) k = 1;
          if (k > periodsCount) k = periodsCount;
          zone = "p" + k;
        } else if (raw.zone === "pool") {
          zone = "pool";
        }
      }
      const rawDeps = Array.isArray(raw.deps) ? raw.deps : [];
      const deps = rawDeps
        .filter(x => typeof x === "string" && x && x !== id);
      cards.push({
        id: id,
        name: String(raw.name || "未命名需求"),
        pm: n(raw.pm), fe: n(raw.fe), be: n(raw.be), qa: n(raw.qa),
        priority: lvl(raw.priority),
        complexity: lvl(raw.complexity),
        deps: deps,
        zone: zone
      });
    });
    // deps 二次清理：剔除已不存在的 id
    const idSet = new Set(cards.map(c => c.id));
    cards.forEach(c => {
      c.deps = (c.deps || []).filter(d => idSet.has(d));
    });
    nextId = Math.max(maxId + 1, (parseInt(obj.nextId, 10) || 0));
    if (obj.viewState && obj.viewState.pool) {
      viewState.pool.sort = obj.viewState.pool.sort || "pri";
      viewState.pool.q    = String(obj.viewState.pool.q || "");
    }
    poolSortEl.value = viewState.pool.sort;
    poolSearchEl.value = viewState.pool.q;
  }

  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return false;
      const obj = JSON.parse(raw);
      applyData(obj);
      return true;
    } catch (_) {
      return false;
    }
  }

  function loadDefaultCards() {
    cards.length = 0;
    nextId = 1;
    DEFAULT_CARDS_SNAPSHOT.forEach(d => {
      cards.push(mk(d.name, d.pm, d.fe, d.be, d.qa, d.priority, d.complexity));
    });
    // 二次回填：把 depsByName 翻译成卡片 id
    DEFAULT_CARDS_SNAPSHOT.forEach((d, i) => {
      if (!d.depsByName || d.depsByName.length === 0) return;
      const ids = [];
      d.depsByName.forEach(n => {
        const m = cards.find(c => c.name === n);
        if (m) ids.push(m.id);
      });
      cards[i].deps = ids;
    });
  }

  function exportData() {
    try {
      const blob = new Blob([JSON.stringify(serialize(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const pad = (n) => (n < 10 ? "0" + n : "" + n);
      const d = new Date();
      const stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" +
                    pad(d.getHours()) + pad(d.getMinutes());
      a.href = url;
      a.download = "排兵布阵图-" + stamp + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {
      alert("导出失败：" + (e && e.message ? e.message : "未知错误"));
    }
  }

  function importDataFromFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function() {
      try {
        const obj = JSON.parse(String(reader.result || ""));
        applyData(obj);
        renderAll();
        save();
      } catch (e) {
        alert("导入失败：文件不是有效的 JSON 或数据结构异常。\n" + (e && e.message ? e.message : ""));
      }
    };
    reader.onerror = function() { alert("导入失败：无法读取文件。"); };
    reader.readAsText(file);
  }

  function resetAll() {
    if (!confirm("确认要清空所有存档并恢复内置默认数据吗？此操作不可撤销。")) return;
    try { localStorage.removeItem(LS_KEY); } catch (_) {}
    viewState.pool.sort = "pri"; viewState.pool.q = "";
    poolSortEl.value = "pri";
    poolSearchEl.value = "";
    periodsCount = DEFAULT_PERIODS;
    currentPeriod = 1;
    initDates();
    $("r_pm").value = 2; $("r_be").value = 2; $("r_fe").value = 1;
    $("r_fs").value = 1; $("r_qa").value = 1; $("r_hours").value = 8;
    $("r_holidayOn").checked = true;
    $("r_customHolidays").value = "";
    $("r_buffer").value = 20;
    $("r_rampOn").checked = false;
    $("r_newcomers").value = 0;
    loadDefaultCards();
    renderAll();
  }

  function moveCard(id, zone) {
    const c = cards.find(x => x.id === id);
    if (c) { c.zone = zone; renderAll(); save(); }
  }

  function delCard(id) {
    const c = cards.find(x => x.id === id);
    if (!c) return;
    if (confirm(`确定删除「${c.name}」？`)) {
      const i = cards.indexOf(c);
      cards.splice(i, 1);
      // 同时清理其它卡的 deps 中对该 id 的引用，避免悬空依赖
      cards.forEach(other => {
        if (Array.isArray(other.deps) && other.deps.length > 0) {
          other.deps = other.deps.filter(d => d !== id);
        }
      });
      renderAll();
      save();
    }
  }

  let editingId = null;
  const modal = $("modal");

  // 渲染弹窗里的「前置依赖」复选列表
  function renderDepsPicker(editingCard) {
    const wrap = $("m_deps");
    if (!wrap) return;
    const selfId = editingCard ? editingCard.id : null;
    const checked = new Set(editingCard && Array.isArray(editingCard.deps) ? editingCard.deps : []);
    const candidates = cards.filter(c => c.id !== selfId);
    if (candidates.length === 0) {
      wrap.innerHTML = '<div class="empty">暂无其它需求可选作前置依赖。</div>';
      return;
    }
    const sorted = candidates.slice().sort((a, b) => a.name.localeCompare(b.name, "zh"));
    wrap.innerHTML = sorted.map(c => {
      const isChecked = checked.has(c.id) ? "checked" : "";
      return `<label class="dep-item">
        <input type="checkbox" data-dep-id="${c.id}" ${isChecked}>
        <span>${escapeHtml(c.name)}</span>
      </label>`;
    }).join("");
  }

  function readDepsFromPicker(selfId) {
    const wrap = $("m_deps");
    if (!wrap) return [];
    const boxes = wrap.querySelectorAll('input[type="checkbox"][data-dep-id]');
    const out = [];
    boxes.forEach(box => {
      if (box.checked) {
        const id = box.getAttribute("data-dep-id");
        if (id && id !== selfId) out.push(id);
      }
    });
    return out;
  }

  function openModal(card) {
    editingId = card ? card.id : null;
    $("modalTitle").textContent = card ? "编辑需求" : "新增需求";
    $("m_name").value = card ? card.name : "";
    $("m_pm").value = card ? card.pm : 1;
    $("m_fe").value = card ? card.fe : 2;
    $("m_be").value = card ? card.be : 2;
    $("m_qa").value = card ? card.qa : 1;
    $("m_priority").value   = String(card ? card.priority   : 2);
    $("m_complexity").value = String(card ? card.complexity : 2);
    renderDepsPicker(card);
    modal.classList.add("show");
    setTimeout(() => $("m_name").focus(), 30);
  }
  function closeModal() { modal.classList.remove("show"); editingId = null; }

  function saveModal() {
    const name = $("m_name").value.trim();
    if (!name) { alert("请填写需求名称"); return; }
    const num = (id) => Math.max(0, parseFloat($(id).value) || 0);
    const lvl = (id) => {
      const v = parseInt($(id).value, 10);
      return (v === 1 || v === 2 || v === 3) ? v : 2;
    };
    const data = { pm: num("m_pm"), fe: num("m_fe"), be: num("m_be"), qa: num("m_qa") };
    const priority = lvl("m_priority");
    const complexity = lvl("m_complexity");
    const deps = readDepsFromPicker(editingId);
    if (editingId) {
      const c = cards.find(x => x.id === editingId);
      if (c) Object.assign(c, { name, priority, complexity, deps }, data);
    } else {
      cards.push(mk(name, data.pm, data.fe, data.be, data.qa, priority, complexity, deps));
    }
    closeModal();
    renderAll();
    save();
  }

  $("addBtn").addEventListener("click", () => openModal(null));
  $("m_cancel").addEventListener("click", closeModal);
  $("m_save").addEventListener("click", saveModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.classList.contains("show")) closeModal();
  });

  function moveAllFromPeriod(periodIdx) {
    const zone = periodZone(periodIdx);
    const inP = cards.filter(c => c.zone === zone);
    if (inP.length === 0) return;
    if (!confirm(`确定把第${periodIdx}期的 ${inP.length} 个需求全部移回需求池吗？`)) return;
    inP.forEach(c => { c.zone = "pool"; });
    renderAll(); save();
  }

  function setCurrentPeriod(i) {
    if (!isFinite(i) || i < 1) i = 1;
    if (i > periodsCount) i = periodsCount;
    currentPeriod = i;
    renderAll(); save();
  }

  function onListClick(e) {
    const btn = e.target.closest("button[data-act]");
    if (btn) {
      e.stopPropagation();
      const act = btn.getAttribute("data-act");
      const id = btn.getAttribute("data-id");
      const pAttr = btn.getAttribute("data-period");
      const p = pAttr ? parseInt(pAttr, 10) : 0;
      if (act === "add") moveCard(id, periodZone(currentPeriod));
      else if (act === "back") moveCard(id, "pool");
      else if (act === "del") delCard(id);
      else if (act === "edit") {
        const c = cards.find(x => x.id === id);
        if (c) openModal(c);
      } else if (act === "setCurrent") {
        setCurrentPeriod(p);
      } else if (act === "backPeriod") {
        moveAllFromPeriod(p);
      }
      return;
    }
    // 单击卡片切换：池中 → 当前期；某期中 → 回池
    const card = e.target.closest(".card");
    if (card && !card.classList.contains("dragging")) {
      const id = card.getAttribute("data-id");
      const c = cards.find(x => x.id === id);
      if (!c) return;
      const newZone = (c.zone === "pool") ? periodZone(currentPeriod) : "pool";
      moveCard(id, newZone);
    }
  }
  poolList.addEventListener("click", onListClick);
  periodsContainer.addEventListener("click", onListClick);

  let dragId = null;
  let isDragging = false;

  function onDragStart(e) {
    const card = e.target.closest(".card");
    if (!card) return;
    dragId = card.getAttribute("data-id");
    isDragging = true;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragId); } catch (_) {}
  }

  function onDragEnd(e) {
    const card = e.target.closest(".card");
    if (card) card.classList.remove("dragging");
    document.querySelectorAll(".panel.drop-active, .period-panel.drop-active")
      .forEach(el => el.classList.remove("drop-active"));
    dragId = null;
    setTimeout(() => { isDragging = false; }, 50);
  }

  // 拖入区域：池面板 + 任意一个 .period-panel；通过 data-zone 决定目标
  function findDropTarget(node) {
    if (!node) return null;
    if (node === poolPanel) return poolPanel;
    if (node.closest) {
      const pp = node.closest(".period-panel");
      if (pp) return pp;
      if (node.closest("#poolPanel")) return poolPanel;
    }
    return null;
  }

  function onContainerDragOver(e) {
    const target = findDropTarget(e.target);
    if (!target) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    // 清掉其他面板的高亮
    document.querySelectorAll(".panel.drop-active, .period-panel.drop-active")
      .forEach(el => { if (el !== target) el.classList.remove("drop-active"); });
    target.classList.add("drop-active");
  }

  function onContainerDragLeave(e) {
    const target = findDropTarget(e.target);
    if (!target) return;
    if (e.relatedTarget && target.contains(e.relatedTarget)) return;
    target.classList.remove("drop-active");
  }

  function onContainerDrop(e) {
    const target = findDropTarget(e.target);
    if (!target) return;
    e.preventDefault();
    target.classList.remove("drop-active");
    const id = dragId || (e.dataTransfer && e.dataTransfer.getData("text/plain"));
    if (!id) return;
    const zone = target.getAttribute("data-zone");
    if (!zone) return;
    moveCard(id, zone);
  }

  // dragstart / dragend：用容器级委托覆盖池和所有期
  [poolList, periodsContainer].forEach(el => {
    el.addEventListener("dragstart", onDragStart);
    el.addEventListener("dragend", onDragEnd);
  });

  // drop：池面板自身；多期容器内每个 .period-panel 用委托
  [poolPanel, periodsContainer].forEach(el => {
    el.addEventListener("dragover", onContainerDragOver);
    el.addEventListener("dragleave", onContainerDragLeave);
    el.addEventListener("drop", onContainerDrop);
  });

  // 批量：全部加入「当前期」/ 全部移回需求池（所有期）
  $("addAllBtn").addEventListener("click", () => {
    const poolCards = cards.filter(c => c.zone === "pool");
    if (poolCards.length === 0) return;
    const zone = periodZone(currentPeriod);
    poolCards.forEach(c => { c.zone = zone; });
    renderAll(); save();
  });

  $("backAllBtn").addEventListener("click", () => {
    const allocated = cards.filter(c => isPeriodZone(c.zone));
    if (allocated.length === 0) return;
    if (!confirm(`确定把全部 ${allocated.length} 个已分配需求移回需求池吗？`)) return;
    allocated.forEach(c => { c.zone = "pool"; });
    renderAll(); save();
  });

  // 团队 / 设置输入 → 整体重算
  ["r_pm","r_be","r_fe","r_fs","r_qa","r_hours"].forEach(id => {
    $(id).addEventListener("input", () => { renderAll(); save(); });
  });
  ["r_start","r_end"].forEach(id => {
    $(id).addEventListener("change", () => { renderAll(); save(); });
    $(id).addEventListener("input", () => { renderAll(); save(); });
  });
  $("r_holidayOn").addEventListener("change", () => { renderAll(); save(); });
  $("r_customHolidays").addEventListener("input", () => { renderAll(); save(); });
  ["r_buffer","r_newcomers"].forEach(id => {
    $(id).addEventListener("input", () => { renderAll(); save(); });
  });
  $("r_rampOn").addEventListener("change", () => { renderAll(); save(); });

  // 排序 + 搜索：仅作用于需求池
  poolSortEl.addEventListener("change", () => {
    viewState.pool.sort = poolSortEl.value;
    renderAll(); save();
  });
  poolSearchEl.addEventListener("input", () => {
    viewState.pool.q = poolSearchEl.value.trim();
    renderPool(); save();
  });

  // 期数加减
  periodMinusBtn.addEventListener("click", () => {
    if (periodsCount <= MIN_PERIODS) return;
    const removed = periodsCount;
    // 把被裁掉那一期的卡迁回需求池
    cards.forEach(c => { if (c.zone === periodZone(removed)) c.zone = "pool"; });
    periodsCount--;
    if (currentPeriod > periodsCount) currentPeriod = periodsCount;
    renderAll(); save();
  });
  periodPlusBtn.addEventListener("click", () => {
    if (periodsCount >= MAX_PERIODS) return;
    periodsCount++;
    renderAll(); save();
  });
  currentPeriodSel.addEventListener("change", () => {
    const v = parseInt(currentPeriodSel.value, 10);
    if (isFinite(v) && v >= 1 && v <= periodsCount) {
      currentPeriod = v;
      renderAll(); save();
    }
  });

  // 顶部工具栏：导入 / 导出 / 重置
  $("exportBtn").addEventListener("click", exportData);
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importDataFromFile(f);
    e.target.value = "";
  });
  $("resetBtn").addEventListener("click", resetAll);

  // 打印/导出排期：用浏览器原生 window.print()，搭配 @media print 隐藏控件
  $("printBtn").addEventListener("click", () => {
    try { window.print(); } catch (_) {}
  });

  const themeSelect = $("themeSelect");
  if (themeSelect) {
    const current = document.documentElement.getAttribute("data-theme") || "midnight";
    themeSelect.value = current;
    themeSelect.addEventListener("change", () => {
      const v = themeSelect.value;
      document.documentElement.setAttribute("data-theme", v);
      try { localStorage.setItem("cp_theme", v); } catch (_) {}
    });
  }

  // 高级设置折叠状态：默认收起；用户展开/收起后记忆到 localStorage
  const advancedDetails = $("advancedDetails");
  if (advancedDetails) {
    try {
      if (localStorage.getItem("cp_adv_open") === "1") advancedDetails.open = true;
    } catch (_) {}
    advancedDetails.addEventListener("toggle", () => {
      try {
        localStorage.setItem("cp_adv_open", advancedDetails.open ? "1" : "0");
      } catch (_) {}
    });
  }

  // ===== 迭代10：一键演示模式（迭代11：加入飞行动画 + 整体不够口径） =====
  // 点击「▶ 一键演示」自动走完演示剧本（全塞爆 → 整体不够 → 分期排开 → 完工日）。
  // 演示开始前快照 cards.zone / periodsCount / currentPeriod，结束或中断后完整恢复。
  // 演示过程不调用 save()，只在 finally 中恢复后 save() 一次，避免污染 localStorage。
  (function setupDemoMode() {
    const demoBtn = $("demoBtn");
    const narration = $("demoNarration");
    if (!demoBtn || !narration) return;

    let running = false;
    let aborted = false;

    function showNarration(html, tone) {
      narration.innerHTML = html;
      narration.setAttribute("data-tone", tone || "info");
      narration.classList.add("show");
    }
    function hideNarration() {
      narration.classList.remove("show");
      narration.removeAttribute("data-tone");
    }
    function highlightConclusion() {
      const el = $("conclusion");
      if (el) el.classList.add("demo-highlight");
    }
    function unhighlightConclusion() {
      const el = $("conclusion");
      if (el) el.classList.remove("demo-highlight");
    }
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
    // 拆成小片段轮询 aborted，便于快速中断
    async function waitInterruptible(ms) {
      const slice = 100;
      let left = ms;
      while (left > 0 && !aborted) {
        const t = Math.min(slice, left);
        await sleep(t);
        left -= t;
      }
    }

    // 焦点跟随：平滑滚动到目标元素（顶部留150px给字幕），并短暂脉冲高亮
    async function focusOn(target) {
      const el = typeof target === "string" ? $(target.replace(/^#/, "")) : target;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const top = window.pageYOffset + rect.top - 150;
      window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
      el.classList.add("demo-focus-pulse");
      setTimeout(() => { el.classList.remove("demo-focus-pulse"); }, 1500);
    }

    function snapshotState() {
      return {
        cards: cards.map(c => ({ id: c.id, zone: c.zone })),
        periodsCount: periodsCount,
        currentPeriod: currentPeriod
      };
    }
    function restoreState(s) {
      if (!s) return;
      const zoneById = Object.create(null);
      s.cards.forEach(x => { zoneById[x.id] = x.zone; });
      cards.forEach(c => {
        if (zoneById[c.id] !== undefined) c.zone = zoneById[c.id];
      });
      periodsCount = s.periodsCount;
      currentPeriod = s.currentPeriod;
    }

    // 按 name 关键字找卡片，找不到不报错
    function findByName(keyword) {
      return cards.find(x => x && typeof x.name === "string" && x.name.indexOf(keyword) >= 0);
    }

    // 飞行动画：克隆源卡片为 position:fixed 浮层，缓动到目标面板位置，缩小+淡出
    // 返回 { wait, remove }；环境异常或元素缺失时返回 null（调用方静默回退为瞬间移动）
    const flightLayer = [];
    function flyCardToPeriod(cardEl, targetPanelEl) {
      if (!cardEl || !targetPanelEl) return null;
      let srcRect, dstRect;
      try {
        srcRect = cardEl.getBoundingClientRect();
        dstRect = targetPanelEl.getBoundingClientRect();
      } catch (_) { return null; }
      if (!srcRect || !dstRect || srcRect.width === 0 || srcRect.height === 0) return null;
      let clone;
      try { clone = cardEl.cloneNode(true); } catch (_) { return null; }
      if (!clone) return null;
      clone.removeAttribute("draggable");
      clone.style.position = "fixed";
      clone.style.left = srcRect.left + "px";
      clone.style.top = srcRect.top + "px";
      clone.style.width = srcRect.width + "px";
      clone.style.height = srcRect.height + "px";
      clone.style.margin = "0";
      clone.style.pointerEvents = "none";
      clone.style.zIndex = "9999";
      clone.style.transition = "transform .6s cubic-bezier(.4,.2,.2,1), opacity .6s ease";
      clone.style.boxShadow = "0 18px 38px rgba(0,0,0,.35)";
      clone.classList.add("demo-flying-card");
      document.body.appendChild(clone);
      flightLayer.push(clone);
      const dx = (dstRect.left + dstRect.width / 2) - (srcRect.left + srcRect.width / 2);
      const dy = (dstRect.top + 60) - srcRect.top;
      const wait = new Promise(resolve => {
        let done = false;
        const fin = () => { if (!done) { done = true; resolve(); } };
        requestAnimationFrame(() => {
          clone.style.transform = "translate(" + dx + "px," + dy + "px) scale(.72)";
          clone.style.opacity = "0.2";
        });
        clone.addEventListener("transitionend", fin, { once: true });
        setTimeout(fin, 900);
      });
      const remove = () => {
        if (clone.parentNode) clone.parentNode.removeChild(clone);
        const i = flightLayer.indexOf(clone);
        if (i >= 0) flightLayer.splice(i, 1);
      };
      return { wait, remove };
    }
    function clearFlyingCards() {
      while (flightLayer.length) {
        const el = flightLayer.pop();
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }
    }

    // 把单张卡片从当前所在容器飞入指定 zone，飞行结束改 zone 并 renderAll；中断或元素缺失静默回退
    async function flyOneToZone(c, zone) {
      if (!c) return;
      const targetPanel = document.querySelector('.period-panel[data-zone="' + zone + '"]');
      const cardEl = document.querySelector('[data-zone="' + c.zone + '"] .card[data-id="' + c.id + '"]');
      const flight = flyCardToPeriod(cardEl, targetPanel);
      if (!flight) {
        c.zone = zone;
        renderAll();
        return;
      }
      await flight.wait;
      c.zone = zone;
      try { renderAll(); } catch (_) {}
      flight.remove();
    }

    // 演示剧本：6 步（开场 → 全塞（逐张飞入）→ 整体不够 → 分期（飞行）→ 完工日 → 收尾）
    const STEPS = [
      {
        narration: '这是一个帮助老板 <b>排兵布阵</b> 的工具',
        tone: "info",
        delay: 2200,
        action: async () => {
          await sleep(300);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      },
      {
        narration: '假设老板说：这 <b>8 个需求</b> 都「<b>马上要</b>」！',
        tone: "over",
        delay: 600,
        action: async () => {
          // 先把所有卡片放回需求池，让观众看到一批 backlog
          showNarration('假设老板说：这 <b>8 个需求</b> 都「<b>马上要</b>」！', "over");
          cards.forEach(c => { c.zone = "pool"; });
          if (periodsCount < 3) periodsCount = 3;
          currentPeriod = 1;
          renderAll();
          await sleep(250);
          if (aborted) return;
          await focusOn("poolPanel");
          await waitInterruptible(450);
          if (aborted) return;
          // 逐张飞入第1期（按当前列表顺序，stagger ~200ms）
          const toMove = cards.slice();
          for (let i = 0; i < toMove.length; i++) {
            if (aborted) break;
            await flyOneToZone(toMove[i], "p1");
            if (aborted) break;
            await waitInterruptible(140);
          }
          if (aborted) return;
          const p1 = document.querySelector('.period-panel[data-zone="p1"]');
          if (p1) await focusOn(p1);
        }
      },
      {
        narration: '结果——<b>需求太多</b>，人力根本无法承载',
        tone: "over",
        delay: 2800,
        action: async () => {
          highlightConclusion();
          await sleep(300);
          // 整体不够：聚焦整个第1期面板（而不是单点测试条）
          const p1 = document.querySelector('.period-panel[data-zone="p1"]');
          if (p1) await focusOn(p1);
        }
      },
      {
        narration: '正确做法：<b>分 3 期排开</b>，按优先级 / 大块头分配',
        tone: "ok",
        delay: 700,
        action: async () => {
          showNarration('正确做法：<b>分 3 期排开</b>，按优先级 / 大块头分配', "ok");
          unhighlightConclusion();
          if (periodsCount < 3) periodsCount = 3;
          // P1 保留：项目进度 / 安全隐患 / 考勤打卡（已在 p1，不动）
          // 飞行计划：把代表性大块头/低优搬到 p2/p3
          const plan = [
            ["签合同",   "p2"],
            ["材料申领", "p2"],
            ["工地巡检", "p2"],
            ["工资条",   "p3"],
            ["消息通知", "p3"]
          ];
          for (let i = 0; i < plan.length; i++) {
            if (aborted) break;
            const c = findByName(plan[i][0]);
            if (!c) continue;
            await flyOneToZone(c, plan[i][1]);
            if (aborted) break;
            await waitInterruptible(120);
          }
          if (aborted) return;
          const p2 = document.querySelector('.period-panel[data-zone="p2"]');
          if (p2) await focusOn(p2);
        }
      },
      {
        narration: '看顶部：<b>全部做完需 3 期</b>，最晚到哪天已自动反推',
        tone: "info",
        delay: 2800,
        action: async () => {
          highlightConclusion();
          await sleep(300);
          await focusOn("conclusion");
        }
      },
      {
        narration: '这就是 <b>排兵布阵</b>：有多少人 × 多长时间 = 能做多少事',
        tone: "ok",
        delay: 2400,
        action: async () => {
          unhighlightConclusion();
          await sleep(300);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }
    ];

    async function runDemo() {
      const snapshot = snapshotState();
      aborted = false;
      running = true;
      document.body.classList.add("demo-mode");
      demoBtn.classList.add("demo-running");
      demoBtn.textContent = "演示中… ⏸";

      try {
        for (let i = 0; i < STEPS.length; i++) {
          if (aborted) break;
          const step = STEPS[i];
          try { if (typeof step.action === "function") await step.action(); } catch (_) {}
          if (aborted) break;
          showNarration(step.narration, step.tone);
          await waitInterruptible(step.delay);
        }
      } catch (_) {
        // 任何意外都走到 finally 恢复
      } finally {
        hideNarration();
        unhighlightConclusion();
        clearFlyingCards();
        restoreState(snapshot);
        try { renderAll(); } catch (_) {}
        try { save(); } catch (_) {}
        demoBtn.classList.remove("demo-running");
        demoBtn.textContent = "▶ 一键演示";
        document.body.classList.remove("demo-mode");
        running = false;
        aborted = false;
      }
    }

    demoBtn.addEventListener("click", () => {
      if (running) { aborted = true; return; }
      runDemo();
    });
  })();

  // 启动：优先从 localStorage 恢复；无存档或解析失败时用内置默认数据
  initDates();
  const restored = loadFromStorage();
  if (!restored) {
    loadDefaultCards();
  }
  renderAll();
})();
</script>
</body>
</html>
